name: Security scan
# Shared secret and dependency scan. A repo's CI calls it with:
#
#   jobs:
#     security:
#       uses: Datumpin/DEVKIT/.gitea/workflows/security-scan.yml@main
#
# gitleaks checks the commits a pull request adds (the whole tree on any other
# event) with its default rules, plus the calling repo's own .gitleaks.toml
# when it has one. osv-scanner checks every requirements file and lockfile
# against osv.dev; private datumpin packages simply find no advisories.
# npm audit is deliberately not used: it posts the whole dependency tree,
# private @datumpin names included, to the public npm registry.
#
# The tools are pinned release binaries, checked against their published
# SHA-256 before they run. To upgrade one, change its version and checksum
# together (both come from the release's checksums file).
on:
  workflow_call:

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_VERSION: "2.7.0"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/bin && tar -xzf /tmp/gitleaks.tar.gz -C /tmp/bin gitleaks

      - name: Scan for secrets
        # --redact keeps a found secret out of the job log.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            /tmp/bin/gitleaks git --redact --no-banner --log-opts="$BASE..$HEAD" .
          else
            /tmp/bin/gitleaks dir --redact --no-banner .
          fi

  dependencies:
    name: dependencies (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner

      - name: Scan dependencies
        # Exit 1 means known vulnerabilities; 128 means the repo has no
        # requirements file or lockfile to scan, which is not a failure.
        run: |
          set +e
          /tmp/osv-scanner scan source --recursive .
          CODE=$?
          if [ "$CODE" -eq 128 ]; then
            echo "No requirements files or lockfiles found; nothing to scan."
            exit 0
          fi
          exit "$CODE"
