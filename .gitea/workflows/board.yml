name: Board
# Moves DEVKIT's tickets across its Board as pull requests progress. Calls
# board-sync from this checkout and has it fetch board_sync.py at this commit;
# other repos call it @main and get the script from main.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  issues:
    types: [opened, closed, reopened]

jobs:
  board:
    uses: ./.gitea/workflows/board-sync.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
