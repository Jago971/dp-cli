[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "datumpin-dp"
description = "dp: the datumpin plugin's command line for the flows, repeated Gitea work and token reports"
requires-python = ">=3.11"
dependencies = [
    "typer==0.27.3",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "questionary==2.1.1",
]
dynamic = ["version"]

[project.scripts]
dp = "dp.cli:main"

# One version for the plugin and dp: the plugin's own.
[tool.hatch.version]
path = "../.claude-plugin/plugin.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/dp"]

# The flow map and the skills ship inside dp, so `dp guide` reads its own
# version's, wherever pipx installed it from.
[tool.hatch.build.targets.wheel.force-include]
"../flows.yaml" = "dp/data/flows.yaml"
"../skills" = "dp/data/skills"
