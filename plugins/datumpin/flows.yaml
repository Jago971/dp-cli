# The flows, as steps. The guide skill reads this file to show where you are
# and offer what comes next, so the order of work lives in one place instead
# of in each skill. A step is defined once under `steps`; a flow lists the
# steps it uses. The guide offers only the `next` and `optional` steps the
# current flow lists, so a shared step (review) carries each flow's
# successor; a `fork` may lead into another flow (the one that lists its step).
#
# Per step:
#   skill     the skill that runs the step. Two have no skill file: `agent`,
#             a step the agent does directly in its `formats` shape (a commit,
#             a tag), and `human`, a person's action the guide waits for.
#   env       where the step runs (gitea-workflows, Environments), so the
#             guide can say whether it touches the laptop, CI or a server
#   does      the choice line the guide prints
#   next      the steps that may follow; the first is the usual one
#   optional  steps that may come before the next one
#   fork      condition -> step, offered beside `next`; it may switch flow

flows:
  ticket:
    does: One ticket from Backlog to merged and tried on prep
    steps: [pick, shape, build, diagnose, check, commit, review, fix, pr, merge, try]
  release:
    does: A milestone through its DoD gate to a tagged release
    steps: [gate, review, fix, release-pr, sign-off, tag, close]
  align:
    does: Find drift between code, tickets and plans, then fix it
    steps: [align]
  deploy:
    does: Bring a server up to its channel's images
    steps: [deploy-prep, try]
  session:
    does: Start or end a working session
    steps: [board, handoff, retro]

steps:
  board:
    skill: board
    env: dev
    does: Sync the board and suggest the next ticket
    next: [handoff]
    fork: {work a ticket: pick, the backlog or plans drifted: align, a milestone is ready: gate}
  pick:
    skill: board
    env: dev
    does: Take a Backlog ticket into In Progress on its branch
    next: [build]
    fork: {the ticket is in Triage or unscoped: shape}
  shape:
    skill: shape
    env: dev
    does: Scope the idea or ticket into Backlog tickets
    next: [pick]
  build:
    skill: tdd
    env: dev
    does: Agree the seams, then build red to green in the dev containers
    next: [check]
    optional: [diagnose]
  diagnose:
    skill: diagnosing-bugs
    env: dev
    does: Build a red feedback loop for a hard bug
    next: [build]
  check:
    skill: definition-of-done
    env: dev
    does: Tick the change checklist, with the tests passing locally
    next: [commit]
  commit:
    skill: agent
    env: dev
    does: Commit on the ticket branch
    next: [review]
  review:
    skill: change-review
    env: dev
    does: Review the diff (Standards, Spec; Security at a promotion)
    next: [fix, pr, release-pr]
  fix:
    skill: change-review
    env: dev
    does: Apply the dispositions, then commit
    next: [pr, release-pr]
    optional: [review]
  pr:
    skill: gitea
    env: ci
    does: Push and open the PR, with its Review section
    next: [merge]
  merge:
    skill: human
    env: ci
    does: Merge the PR into prep once CI is green
    next: [try, pick]
    fork: {prep must pull first: deploy-prep}
  try:
    skill: human
    env: prep
    does: Try the change on prep
    next: [pick]
    fork: {every ticket in the milestone is tried: gate, carry on: board}
  gate:
    skill: definition-of-done
    env: prep
    does: Move the milestone's tickets to DoD
    next: [review]
  release-pr:
    skill: definition-of-done
    env: ci
    does: Open the prep -> main PR with the DoD worksheet
    next: [sign-off]
  sign-off:
    skill: human
    env: ci
    does: Sign the worksheet and merge the release PR
    next: [tag]
  tag:
    skill: agent
    env: prod
    does: Tag vX.Y.Z on main and update the plugin in each repo
    next: [close]
  close:
    skill: gitea
    env: prod
    does: Post Done pointers for the tickets and milestone to close
    next: []
    fork: {carry on: board}
  align:
    skill: align
    env: dev
    does: Report drift, draft the fixes, apply what you accept
    next: []
    fork: {carry on: board}
  deploy-prep:
    skill: config-led-deployment
    env: prep
    does: Pull and restart the :prep images on Hammond
    next: [try]
  handoff:
    skill: handoff
    env: dev
    does: Write the handoff document and its Handover block
    next: [retro]
  retro:
    skill: retro
    env: dev
    does: Review the session and suggest improvements
    next: []
