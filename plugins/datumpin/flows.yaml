# The flows, as steps. `dp guide` (and the guide skill through it) reads this
# file to show where you are and offer what comes next, so the order of work
# lives in one place instead of in each skill. A step is defined once under
# `steps`; a flow lists the steps it uses. The guide offers only the `next`
# and `optional` steps the current flow lists, so a shared step (review)
# carries each flow's successor; a `fork` may lead into another flow (the one
# that lists its step).
#
# Per step:
#   skill     the skill that runs the step. Two have no skill file: `agent`,
#             a step the agent does directly in its `formats` shape (a commit,
#             a tag; `dp guide` runs `finish` and `defect` itself, with no
#             agent), and `human`, a person's action the guide waits for.
#   env       where the step runs (gitea-workflows, Environments), so the
#             guide can say whether it touches the laptop, CI or a server
#   does      the choice line the guide prints
#   next      the steps that may follow; the first is the usual one
#   optional  steps that may come before the next one
#   fork      condition -> step, offered below `next`; it may switch flow. A
#             fork `{step, when}` is offered only when `dp` finds its check
#             holds: `unscoped` (the ticket has no Acceptance), or
#             `milestone_tested` (every other ticket in the ticket's milestone
#             is in Testing with a Tested Pointer, or past it)
#   brief     the skill sections (`skill#Heading`) a job brief from `dp guide`
#             carries; without it, a brief carries the step's whole skill
#
# `columns` places a ticket from its board column, over the state file: at
# `step` (of `flow`, the ticket flow when omitted), unless the state's step is
# one the column `keep`s.

columns:
  Triage: {step: shape}
  Backlog: {step: pick}
  In Progress: {step: build, keep: [build, diagnose, check, commit, review, fix]}
  Review: {step: merge, keep: [fix, pr]}
  Testing: {step: test}
  DoD: {flow: release, step: review}
  Done: {flow: session, step: board}

flows:
  ticket:
    does: One ticket from Backlog to merged and tested on prep
    steps: [pick, shape, build, diagnose, check, commit, review, fix, pr, merge, test, finish, defect]
  release:
    does: A milestone through its DoD gate to a tagged release
    steps: [gate, review, fix, release-pr, sign-off, tag, close]
  align:
    does: Find drift between code, tickets and plans, then fix it
    steps: [align]
  deploy:
    does: Bring a server up to its channel's images
    steps: [deploy-prep, test]
  session:
    does: Start or end a working session
    steps: [board, retro, handoff]

steps:
  board:
    skill: board
    env: dev
    does: Sync the board and suggest the next ticket
    next: [retro]
    fork: {work a ticket: pick, the backlog or plans drifted: align, a milestone is ready: gate}
  pick:
    skill: board
    env: dev
    does: Take a Backlog ticket into In Progress on its branch
    next: [build, diagnose]
    fork: {the ticket is unscoped: {step: shape, when: unscoped}}
  shape:
    skill: shape
    env: dev
    does: Scope the idea or ticket into Backlog tickets
    next: [pick]
  build:
    skill: tdd
    env: dev
    does: Agree the seams, then build red to green in the dev containers
    next: [check]
  diagnose:
    skill: diagnosing-bugs
    env: dev
    does: Build a red feedback loop for a hard bug
    next: [build]
  check:
    skill: change-ready
    env: dev
    does: Tick the change checklist, with the tests passing locally
    next: [commit]
  commit:
    skill: agent
    env: dev
    does: Commit on the ticket branch
    brief: [formats#Commit]
    next: [review]
  review:
    skill: change-review
    env: dev
    does: Review the diff (Standards, Spec; Security at a promotion)
    next: [fix, pr, release-pr]
  fix:
    skill: change-review
    env: dev
    does: Apply the dispositions, then commit
    next: [pr, release-pr]
    optional: [review]
  pr:
    skill: gitea
    env: ci
    does: Push and open the PR, with its Review section
    brief: [gitea#Calling dp, gitea#Labels, formats#Pull request]
    next: [merge]
  merge:
    skill: human
    env: ci
    does: You merge the PR into prep once CI is green
    next: [test, pick]
    fork: {prep must pull first: deploy-prep}
  test:
    skill: human
    env: prep
    does: You test the change by hand where it runs
    next: [finish, defect]
    fork: {every ticket in the milestone is tested: {step: gate, when: milestone_tested}, carry on: board}
  finish:
    skill: board
    env: prep
    does: Tested OK? Records the Tested Pointer and closes the ticket
    next: [pick]
    fork: {carry on: board}
  defect:
    skill: board
    env: prep
    does: A defect at test; reopens the ticket to Backlog
    next: [pick]
  gate:
    skill: dp
    env: prep
    does: Move the milestone's tickets to DoD
    next: [review]
  release-pr:
    skill: change-ready
    env: ci
    does: Open the prep -> main PR with the DoD worksheet
    next: [sign-off]
  sign-off:
    skill: human
    env: ci
    does: You sign the worksheet and merge the release PR
    next: [tag]
  tag:
    skill: dp
    env: prod
    does: Tag vX.Y.Z on main and push the tag
    next: [close]
  close:
    skill: gitea
    env: prod
    does: Post Done pointers for the tickets and milestone to close
    next: []
    fork: {carry on: board}
  align:
    skill: align
    env: dev
    does: Report drift, draft the fixes, apply what you accept
    next: []
    fork: {carry on: board}
  deploy-prep:
    skill: config-led-deployment
    env: prep
    does: Pull and restart the :prep images on prep (Hammond)
    next: [test]
  handoff:
    skill: handoff
    env: dev
    does: Write the handoff document and its Handover block
    next: []
  retro:
    skill: retro
    env: dev
    does: Review the session and suggest improvements
    next: [handoff]
