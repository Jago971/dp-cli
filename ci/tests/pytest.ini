[pytest]
testpaths = .
# dp runs from the source tree, never an installed copy.
pythonpath = ../../plugins/datumpin/dp/src
python_files = test_*.py
addopts = --durations=10
markers =
    unit: no network, no Docker, no server; runs in milliseconds
    integration: needs a Docker daemon (and pulls public base images); skipped without one
    contract: checks another repo's interface
